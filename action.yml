name: checkOwners
description: >-
  Infer CODEOWNERS from git history with confidence scoring, drift detection,
  bus factor analysis, and expertise decay alerts.
author: Samir Musali
branding:
  icon: shield
  color: blue

inputs:
  config:
    description: Path to the checkowners.yml file.
    required: false
    default: .github/checkowners.yml
  mode:
    description: Drift mode (commit | repo | both).
    required: false
    default: both
  include_bus_factor:
    description: Emit the bus_factor_summary output.
    required: false
    default: "true"
  include_decay:
    description: Emit the decay_summary output.
    required: false
    default: "true"
  fail_on_drift:
    description: Fail the action when drift_detected is true.
    required: false
    default: "true"
  comment_on_pr:
    description: >-
      Post a drift + bus-factor summary comment on pull requests. Requires the
      calling workflow to grant `pull-requests: write`.
    required: false
    default: "true"
  python_version:
    description: Python version to set up.
    required: false
    default: "3.13"
  checkowners_version:
    description: >-
      Advanced override for the checkowners package version. Omit or leave
      at the default to install the version that matches this Action tag.
      An empty value uses the pin, never the latest PyPI release.
    required: false
    default: "0.5.0"
  install_spec:
    description: >-
      SECURITY-SENSITIVE. Interpolating untrusted workflow data into this
      input is remote code execution. Allowed only as a local extras spec
      for dogfooding this repository: ".", ".[graph]", ".[github]",
      ".[graph,github]", ".[github,graph]", or ".[all]". Downstream
      callers must omit this input.
    required: false
    default: ""
  index_url:
    description: Optional pip --index-url for an internal package mirror.
    required: false
    default: ""
  offline:
    description: >-
      Install the committed wheel with --no-index --find-links. A fully
      air-gapped runner also needs the lockfile wheels on disk or a mirror.
    required: false
    default: "false"
  github_token:
    description: >-
      Token exported as GITHUB_TOKEN for CLI handle resolution and API
      features. Override with a PAT or App token when the default job
      token cannot list org teams.
    required: false
    default: ${{ github.token }}

outputs:
  checkowners_drift:
    description: JSON payload of the drift report.
    value: ${{ steps.run.outputs.checkowners_drift }}
  bus_factor_summary:
    description: JSON payload listing per-path bus factors and critical paths.
    value: ${{ steps.bus_factor.outputs.bus_factor_summary }}
  decay_summary:
    description: JSON payload listing decaying ownership entries.
    value: ${{ steps.decay.outputs.decay_summary }}

runs:
  using: composite
  steps:
    - name: Verify full git history
      shell: bash
      run: |
        # checkowners infers ownership from git log + git blame; a shallow
        # clone (actions/checkout default) would silently produce an empty
        # or wildly wrong ownership map. Fail fast with a fix instead.
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error title=checkOwners needs full history::Shallow clone detected. Add 'fetch-depth: 0' to your actions/checkout step so git log and git blame can see the repository history."
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install checkowners
      shell: bash
      env:
        CHECKOWNERS_VERSION: ${{ inputs.checkowners_version }}
        CHECKOWNERS_INSTALL_SPEC: ${{ inputs.install_spec }}
        CHECKOWNERS_INDEX_URL: ${{ inputs.index_url }}
        CHECKOWNERS_OFFLINE: ${{ inputs.offline }}
        CHECKOWNERS_PINNED_VERSION: "0.5.0"
      run: |
        set -euo pipefail
        ACTION_ROOT="${GITHUB_ACTION_PATH}"
        LOCK="${ACTION_ROOT}/requirements.lock"
        VERSION="${CHECKOWNERS_VERSION:-$CHECKOWNERS_PINNED_VERSION}"
        INDEX_ARGS=()
        if [ -n "${CHECKOWNERS_INDEX_URL}" ]; then
          INDEX_ARGS+=(--index-url "${CHECKOWNERS_INDEX_URL}")
        fi

        install_lockfile() {
          python -m pip install --no-deps --require-hashes --only-binary=:all: \
            "$@" -r "${LOCK}"
        }

        if [ -n "${CHECKOWNERS_INSTALL_SPEC}" ]; then
          if [ "${CHECKOWNERS_INSTALL_SPEC}" != "." ] \
            && [ "${CHECKOWNERS_INSTALL_SPEC}" != ".[graph]" ] \
            && [ "${CHECKOWNERS_INSTALL_SPEC}" != ".[github]" ] \
            && [ "${CHECKOWNERS_INSTALL_SPEC}" != ".[graph,github]" ] \
            && [ "${CHECKOWNERS_INSTALL_SPEC}" != ".[github,graph]" ] \
            && [ "${CHECKOWNERS_INSTALL_SPEC}" != ".[all]" ]; then
            echo "::error::install_spec must be a local extras spec: . .[graph] .[github] .[graph,github] .[github,graph] .[all]"
            exit 1
          fi
          install_lockfile "${INDEX_ARGS[@]}"
          python -m pip install --no-deps "${CHECKOWNERS_INSTALL_SPEC}"
        elif [ "${CHECKOWNERS_OFFLINE}" = "true" ]; then
          if [ -n "${CHECKOWNERS_VERSION}" ] && [ "${CHECKOWNERS_VERSION}" != "${CHECKOWNERS_PINNED_VERSION}" ]; then
            echo "::error::offline install requires checkowners_version to match the Action pin (${CHECKOWNERS_PINNED_VERSION})"
            exit 1
          fi
          WHEEL="${ACTION_ROOT}/checkowners-${CHECKOWNERS_PINNED_VERSION}-py3-none-any.whl"
          if [ ! -f "${WHEEL}" ]; then
            echo "::error::offline install requires ${WHEEL}"
            exit 1
          fi
          install_lockfile --no-index --find-links "${ACTION_ROOT}"
          python -m pip install --no-deps --no-index --find-links "${ACTION_ROOT}" \
            "checkowners==${CHECKOWNERS_PINNED_VERSION}"
        elif [ -n "${CHECKOWNERS_VERSION}" ] && [ "${CHECKOWNERS_VERSION}" != "${CHECKOWNERS_PINNED_VERSION}" ]; then
          install_lockfile "${INDEX_ARGS[@]}"
          python -m pip install --no-deps --only-binary=:all: \
            "${INDEX_ARGS[@]}" "checkowners==${VERSION}"
        else
          WHEEL="${ACTION_ROOT}/checkowners-${CHECKOWNERS_PINNED_VERSION}-py3-none-any.whl"
          if [ ! -f "${WHEEL}" ]; then
            echo "::error::missing pinned wheel ${WHEEL}"
            exit 1
          fi
          install_lockfile "${INDEX_ARGS[@]}"
          python -m pip install --no-deps --no-index --find-links "${ACTION_ROOT}" \
            "checkowners==${CHECKOWNERS_PINNED_VERSION}"
        fi

        got="$(checkowners --version)"
        if [ -n "${CHECKOWNERS_INSTALL_SPEC}" ]; then
          if [[ ! "${got}" =~ ^checkowners\ [0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::expected 'checkowners <semver>', got: ${got}"
            exit 1
          fi
        elif [ "${got}" != "checkowners ${VERSION}" ]; then
          echo "::error::installed '${got}', expected 'checkowners ${VERSION}'"
          exit 1
        fi

    - name: Run checkowners drift
      id: run
      shell: bash
      env:
        # checkowners reads these env vars (see checkowners/config.py): the
        # action inputs win over whatever the repo's checkowners.yml declares.
        CHECKOWNERS_CONFIG: ${{ inputs.config }}
        CHECKOWNERS_DRIFT_MODE: ${{ inputs.mode }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        checkowners drift --json > drift.json
        {
          echo "checkowners_drift<<EOF"
          cat drift.json
          echo
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        # Also publish the same as the historical key used by older workflows.
        cat drift.json

    - name: Compute bus factor summary
      id: bus_factor
      if: ${{ inputs.include_bus_factor == 'true' }}
      shell: bash
      env:
        CHECKOWNERS_CONFIG: ${{ inputs.config }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        checkowners bus-factor --all --json > bus_factor.json
        {
          echo "bus_factor_summary<<EOF"
          cat bus_factor.json
          echo
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Compute decay summary
      id: decay
      if: ${{ inputs.include_decay == 'true' }}
      shell: bash
      env:
        CHECKOWNERS_CONFIG: ${{ inputs.config }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        checkowners decay --json > decay.json
        {
          echo "decay_summary<<EOF"
          cat decay.json
          echo
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Comment drift summary on PR
      if: ${{ inputs.comment_on_pr == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const MARKER = '<!-- checkowners-drift-report -->';
          const drift = JSON.parse(fs.readFileSync('drift.json', 'utf8'));

          // One managed comment per PR: find ours (by marker) and update it
          // in place so repeated pushes don't pile up stale reports.
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(MARKER));

          if (!drift.drift_detected) {
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `${MARKER}\n### checkOwners: no drift detected\n\nPreviously reported drift has been resolved.`,
              });
            }
            return;
          }

          let critical = [];
          try {
            critical = (JSON.parse(fs.readFileSync('bus_factor.json', 'utf8')).critical_paths) || [];
          } catch (e) { /* bus factor step may be disabled */ }
          let decayCount = 0;
          try {
            decayCount = (JSON.parse(fs.readFileSync('decay.json', 'utf8')).reports || []).length;
          } catch (e) { /* decay step may be disabled */ }
          const badge = critical.length > 0 ? '**CRITICAL**' : (drift.severity || 'drift').toUpperCase();
          const fx = (n) => Number(n).toFixed(2);
          const body = [
            MARKER,
            `### checkOwners: drift detected (${badge})`,
            '',
            critical.length > 0 ? `> **bus_factor=1 path(s):** ${critical.join(', ')}` : '',
            decayCount > 0 ? `> **${decayCount} expertise-decay warning(s)**` : '',
            ...(drift.notes || []).map(n => `> note: ${n}`),
            '',
            '<details><summary>Drift details</summary>',
            '',
            '| Category | Path | Δ confidence |',
            '|----------|------|--------------|',
            ...(drift.stale || []).map(s => `| stale | \`${s.path}\` | ${fx(s.confidence_delta)} |`),
            ...(drift.missing || []).map(m => `| missing | \`${m.path}\` | ${fx(m.confidence_delta)} |`),
            ...(drift.changed || []).map(c => `| changed | \`${c.path}\` | ${fx(c.confidence_delta)} |`),
            '',
            '</details>',
            '',
            'Run `checkowners sync` locally to reconcile.',
          ].filter(Boolean).join('\n');

          if (existing) {
            await github.rest.issues.updateComment({
              comment_id: existing.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
          }

    - name: Fail on drift
      if: ${{ inputs.fail_on_drift == 'true' }}
      shell: bash
      run: |
        python - <<'PY'
        import json, sys
        with open("drift.json") as f:
            data = json.load(f)
        if data.get("drift_detected"):
            print("drift detected:", data.get("severity"), "max_delta=", data.get("max_confidence_delta"))
            sys.exit(1)
        PY
