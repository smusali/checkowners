name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  identity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the previous organization slug reappears
        run: |
          set -euo pipefail
          needle="$(printf '%s%s' 'forty' 'onetech')"
          if git grep -i -- "$needle"; then
            echo "::error::Previous organization slug must not appear in the tree"
            exit 1
          fi

  pypi-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install readme-renderer
        run: pip install "readme-renderer[md]"

      - name: Fail if README or project URLs are not PyPI-safe
        run: python tools/check_pypi_readme.py

      - name: Fail if the Action package pin is inconsistent
        run: python tools/check_changelog.py --check-pins

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # required so git log / git blame have history

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hatch
        run: pip install hatch

      - name: Run tests
        run: hatch run test

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install built wheel
        run: |
          pip install hatch
          hatch build
          wheel=$(ls dist/checkowners-*-py3-none-any.whl)
          pip install "${wheel}[graph]"

      - name: Smoke-test new commands
        run: |
          checkowners analyze --json > analyze.json
          checkowners drift --json > drift.json
          checkowners bus-factor --all --json > bus.json
          checkowners decay --json > decay.json
          checkowners topology --json > topology.json
          checkowners balance --json > balance.json
          # Confirm the artifacts have the expected top-level keys.
          python -c "import json; d=json.load(open('drift.json')); assert 'drift_detected' in d and 'severity' in d, d"
          python -c "import json; d=json.load(open('bus.json')); assert 'entries' in d, d"

  token-missing-warning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install hatch and the local package
        run: |
          pip install hatch
          hatch build
          wheel=$(ls dist/checkowners-*-py3-none-any.whl)
          pip install "${wheel}[graph,github]"

      - name: Warn when api_enabled and GITHUB_TOKEN is unset
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path(".github/checkowners.yml").read_text()
          Path("/tmp/checkowners-api.yml").write_text(
              src.replace("api_enabled: false", "api_enabled: true")
          )
          PY
          set +e
          GITHUB_TOKEN= CHECKOWNERS_CONFIG=/tmp/checkowners-api.yml \
            checkowners analyze --json > /tmp/analyze.json 2> /tmp/analyze.err
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "expected exit code 0, got $code"
            cat /tmp/analyze.err
            exit 1
          fi
          if ! grep -q "github.api_enabled is true but GITHUB_TOKEN is not set" /tmp/analyze.err; then
            echo "expected missing-token warning on stderr"
            cat /tmp/analyze.err
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install hatch
        run: pip install hatch

      - name: Run linters
        run: hatch run lint

      - name: Check formatting
        run: hatch run fmt --check
